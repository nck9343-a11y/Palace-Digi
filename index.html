    <!-- 核心样式引擎 -->
    <style>
        /* ==========================================
           1. 基础设定与宣纸肌理
        ========================================== */
        html, body {
            margin: 0; padding: 0; width: 100%;
            background-color: #F2EFE9; color: #2C2825; font-family: 'Noto Serif SC', 'Georgia', serif;
            scroll-behavior: smooth; overflow-x: hidden; cursor: none; 
        }

        .paper-texture {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: -1;
            background-image: 
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.04"/></svg>'),
                radial-gradient(circle at 10% 20%, rgba(163, 128, 69, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(140, 43, 36, 0.02) 0%, transparent 60%);
        }

        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        /* ==========================================
           2. 沉浸式加载屏 (Preloader)
        ========================================== */
        #preloader {
            position: fixed; inset: 0; background-color: #F2EFE9; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.5s ease-out, visibility 1.5s;
        }
        .seal-large {
            font-family: 'Ma Shan Zheng', cursive; font-size: 5rem; color: #8C2B24; border: 4px solid #8C2B24;
            padding: 10px 20px; border-radius: 8px; transform: rotate(-5deg); opacity: 0;
            animation: stamp-reveal 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .preloader-subtitle {
            margin-top: 40px; font-size: 1rem; letter-spacing: 1em; color: #A38045; opacity: 0;
            animation: fade-up-slow 2s ease forwards 0.8s;
        }
        @keyframes stamp-reveal { 0% { transform: scale(2) rotate(-20deg); opacity: 0; } 100% { transform: scale(1) rotate(-5deg); opacity: 0.85; } }
        @keyframes fade-up-slow { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        /* ==========================================
           3. 自定义光标
        ========================================== */
        #custom-cursor {
            position: fixed; top: 0; left: 0; width: 12px; height: 12px; background-color: #8C2B24;
            border-radius: 50%; pointer-events: none; z-index: 100000; mix-blend-mode: multiply;
            transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s, background-color 0.3s;
        }
        #custom-cursor-follower {
            position: fixed; top: 0; left: 0; width: 40px; height: 40px; border: 1px solid rgba(140, 43, 36, 0.3);
            border-radius: 50%; pointer-events: none; z-index: 99999; transform: translate(-50%, -50%);
            transition: transform 0.15s ease-out;
        }
        body.hovering #custom-cursor { width: 8px; height: 8px; background-color: #A38045; }
        body.hovering #custom-cursor-follower { transform: translate(-50%, -50%) scale(1.5); background-color: rgba(163, 128, 69, 0.1); border-color: rgba(163, 128, 69, 0.5); }

        /* ==========================================
           4. 核心排版：古典竖排与水印
        ========================================== */
        .vertical-text { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 0.4em; }

        .huge-watermark {
            position: absolute; font-size: 55vw; font-weight: 900; color: rgba(163, 128, 69, 0.03); z-index: 0;
            pointer-events: none; white-space: nowrap; line-height: 1; top: 50%; left: 50%;
            transform: translate(-50%, -50%); user-select: none; will-change: transform;
        }
        
        .huge-watermark.en-mode { font-size: 40vw; font-family: 'Georgia', serif; font-weight: 100; letter-spacing: -0.05em; color: rgba(163, 128, 69, 0.02);}

        .giant-quote {
            font-family: 'Georgia', serif; font-size: 12rem; color: rgba(163, 128, 69, 0.15);
            line-height: 0; position: absolute; user-select: none; z-index: -1;
        }

        /* ==========================================
           5. 涌现动画引擎 (Scroll Reveal)
        ========================================== */
        .reveal-up { opacity: 0; transform: translateY(100px); transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal-up.active { opacity: 1; transform: translateY(0); }
        .reveal-fade { opacity: 0; filter: blur(15px); transition: all 2.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal-fade.active { opacity: 1; filter: blur(0); }

        /* ==========================================
           6. 拼贴画意境 (Collage Art)
        ========================================== */
        .collage-container { position: relative; width: 100%; height: 700px; }
        .collage-img {
            position: absolute; filter: sepia(0.3) grayscale(0.2) contrast(1.1);
            box-shadow: 0 40px 80px rgba(44, 40, 37, 0.15); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            object-fit: cover;
        }
        .collage-img:hover { transform: scale(1.03) translateY(-10px); filter: sepia(0) grayscale(0) contrast(1.1); z-index: 30; box-shadow: 0 50px 100px rgba(140, 43, 36, 0.2); }
        .collage-bg-block { position: absolute; background-color: rgba(163, 128, 69, 0.08); border: 1px solid rgba(163, 128, 69, 0.3); z-index: 0; }

        /* ==========================================
           7. 散点透视排版引擎 (Scatter Engine)
        ========================================== */
        .scatter-container { position: relative; width: 100%; min-height: 100vh; }
        .scatter-node { position: absolute; display: flex; flex-direction: column; opacity: 0; transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .scatter-node.active { opacity: 1; }
        .scatter-node:hover { transform: translateY(-8px) scale(1.02); z-index: 50; }

        .scatter-prefix { font-size: 0.9rem; color: #2C2825; opacity: 0.6; margin-bottom: 4px; letter-spacing: 0.2em; font-family: 'Noto Serif SC', 'Georgia', serif;}
        .scatter-label { font-size: 1.2rem; color: #A38045; font-weight: 600; letter-spacing: 0.1em; border-bottom: 1px dashed rgba(163, 128, 69, 0.5); padding-bottom: 4px; display: inline-block; font-family: 'Noto Serif SC', 'Georgia', serif;}
        .scatter-value { font-size: 3.5rem; color: #8C2B24; font-weight: 900; line-height: 1; margin: 10px 0; text-shadow: 2px 4px 15px rgba(140, 43, 36, 0.08); font-family: 'Noto Serif SC', 'Georgia', serif;}
        .scatter-seal { font-family: 'Ma Shan Zheng', cursive; color: #8C2B24; border: 1px solid #8C2B24; padding: 2px 8px; border-radius: 2px; transform: rotate(-12deg); display: inline-block; font-size: 0.8rem; opacity: 0.7; margin-left: 10px; }

        /* ==========================================
           8. 交互组件
        ========================================== */
        .ancient-input {

        }
        .tag-cloud-btn:hover { border-color: #8C2B24; color: #8C2B24; transform: translateY(-4px); box-shadow: 0 10px 20px rgba(140, 43, 36, 0.08); }

        .floating-tools { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; z-index: 1000; }
        .tool-btn {

        .cursor-blink { display: inline-block; width: 2px; height: 1em; background: #8B2E25; animation: blink 1s infinite; vertical-align: middle; margin-left: 6px;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>

        let currentLang = 'zh'; 

        // 光标系统
        const cursor = document.getElementById('custom-cursor');
        const follower = document.getElementById('custom-cursor-follower');
        let mouseX = 0, mouseY = 0, followerX = 0, followerY = 0;
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; cursor.style.left = `${mouseX}px`; cursor.style.top = `${mouseY}px`; });
        function animateCursor() { followerX += (mouseX - followerX) * 0.15; followerY += (mouseY - followerY) * 0.15; follower.style.left = `${followerX}px`; follower.style.top = `${followerY}px`; requestAnimationFrame(animateCursor); }
        animateCursor();
        function bindCursorEvents() {
            document.querySelectorAll('a, button, input, .hover-trigger, .list-item-pro, .scatter-node, .collage-img').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });
        }

        // 加载屏 & 视差 & 观察器
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').style.opacity = '0'; document.getElementById('preloader').style.visibility = 'hidden';
                bindCursorEvents();
            }, 3000);
        });
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            document.querySelectorAll('.parallax-text').forEach(el => { const speed = el.getAttribute('data-speed') || 0.1; el.style.transform = `translate(-50%, calc(-50% + ${scrolled * speed}px))`; });
        });
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('active'); if(entry.target.classList.contains('scatter-node')) entry.target.style.transitionDelay = `${Math.random() * 0.6}s`; } });
        }, observerOptions);
        function observeNewElements() { document.querySelectorAll('.reveal-up, .reveal-fade, .reveal-left, .scatter-node').forEach(el => observer.observe(el)); }
        document.addEventListener("DOMContentLoaded", observeNewElements);

        // 核心加密
        const AES_SECRET_KEY = "PalaceDigiSuperSecretKey32Bytes!";
        async function decryptPayload(base64Ciphertext) {
            try {
                const binaryString = atob(base64Ciphertext); const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const iv = bytes.slice(0, 12); const data = bytes.slice(12); const enc = new TextEncoder();
                const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(AES_SECRET_KEY), "AES-GCM", false, ["decrypt"]);
                const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, keyMaterial, data);
                return JSON.parse(new TextDecoder().decode(decryptedBuffer));
            } catch (e) { return { name: { zh: "真迹损毁", en: "Data Corrupted" } }; }
        }

        const BMOB_APP_ID = "d6f83c6438f18df723076957e3c280c2"; const BMOB_REST_KEY = "c6aa64c596088d8d724243a98d53fcd6";
        const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.hostname === "") ? "http://127.0.0.1:5000" : "https://3a480289.r6.cpolar.top";
        
        let currentTimer = null; let currentData = null; let globalCloudNodes = [];

        // --- 动态获取真实图像 (Wikipedia API) ---
        async function fetchWikiImage(keyword) {
            try {
                // 仅搜索中文维基，因为是古建名
                const res = await fetch(`https://zh.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&piprop=original&titles=${encodeURIComponent(keyword)}&origin=*`);
                const data = await res.json();
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                if (pageId !== "-1" && pages[pageId].original) {
                    return pages[pageId].original.source;
                }
            } catch(e) { console.warn("Wiki Image Fetch failed:", e); }
            return null;
        }

        // 双语切换
        function toggleLang(lang) {
            currentLang = lang;
            document.getElementById('btn-zh').style.background = lang === 'zh' ? '#8C2B24' : 'rgba(245, 244, 240, 0.8)';
            document.getElementById('btn-zh').style.color = lang === 'zh' ? '#F2EFE9' : '#A38045';
            document.getElementById('btn-en').style.background = lang === 'en' ? '#8C2B24' : 'rgba(245, 244, 240, 0.8)';
            document.getElementById('btn-en').style.color = lang === 'en' ? '#F2EFE9' : '#A38045';
            
            // 更新静态 UI 文本
            document.getElementById('searchInput').placeholder = i18n[lang].searchPlaceholder;
            document.getElementById('label-cloud-title').innerText = i18n[lang].cloudTitle;
            document.getElementById('chap1-num').innerText = i18n[lang].chap1Num;
            document.getElementById('chap1-title').innerText = i18n[lang].chap1Title;
            document.getElementById('chap2-num').innerText = i18n[lang].chap2Num;
            document.getElementById('chap2-title').innerText = i18n[lang].chap2Title;
            document.getElementById('chap2-desc').innerHTML = i18n[lang].chap2Desc;
            document.getElementById('chap3-title').innerText = i18n[lang].chap3Title;
            document.getElementById('chap3-seal').innerText = i18n[lang].chap3Seal;

            // 切换水印字体样式
            const watermarks = document.querySelectorAll('.huge-watermark');
            watermarks.forEach(w => lang === 'en' ? w.classList.add('en-mode') : w.classList.remove('en-mode'));

            // 如果有数据，重新渲染内容
            if (currentData) renderUI(currentData, true);
        }

        // 拉取列表
        async function loadDynamicCacheList() {
            const list = document.getElementById('file-list');
            list.innerHTML = `<div class="text-sm text-yihe-gold/50 py-4 tracking-widest font-serif animate-pulse">翻阅藏经阁中...</div>`; 
            try {
                const res = await fetch("https://api.bmobcloud.com/1/classes/BuildingArchive?order=-updatedAt&limit=30", { method: 'GET', headers: { "X-Bmob-Application-Id": BMOB_APP_ID, "X-Bmob-REST-API-Key": BMOB_REST_KEY, "Content-Type": "application/json" } });
                if (!res.ok) throw new Error("API Error");
                const data = await res.json();
                globalCloudNodes = [];
                for (let item of data.results || []) {
                    if (item.payload_encrypted) item.payload = await decryptPayload(item.payload_encrypted);
                    else if (!item.payload && !item.payload_encrypted) continue; 
                    globalCloudNodes.push(item);
                }
                renderNodeList(globalCloudNodes);
            } catch (error) { list.innerHTML = `<div class="text-sm text-yihe-red py-4">${i18n[currentLang].error}</div>`; }
        }

        function renderNodeList(nodes) {
            const list = document.getElementById('file-list'); list.innerHTML = ""; 
            if (nodes.length === 0) { list.innerHTML = `<div class="text-sm text-yihe-ink/40 py-4">${i18n[currentLang].noData}</div>`; return; }
            nodes.forEach((item) => {
                const b = item.payload; if(!b) return; 
                const btn = document.createElement('button');
                btn.className = "px-6 py-2 border border-yihe-border rounded-full text-yihe-ink/70 text-sm tracking-[0.2em] hover:border-yihe-red hover:text-yihe-red transition-all shadow-sm bg-white/30 hover-trigger font-serif";
                btn.innerText = b.name ? (b.name[currentLang] || b.name.zh || "佚名") : "佚名";
                btn.onclick = () => { 
                    renderUI(b, false); 
                    document.getElementById('narrative-flow').classList.remove('hidden');
                    document.getElementById('nav-history').classList.remove('hidden');
                    document.getElementById('nav-dna').classList.remove('hidden');
                    document.getElementById('nav-geo').classList.remove('hidden');
                    setTimeout(() => { observeNewElements(); document.getElementById('chapter-history').scrollIntoView({ behavior: 'smooth' }); }, 100);
                };
                list.appendChild(btn);
            });
            bindCursorEvents();
        }

        function executeHarvest() {
            const searchInput = document.getElementById('searchInput'); const target = searchInput.value.trim(); if (!target) return;
            const btn = document.getElementById('searchBtn'); const status = document.getElementById('search-status');
            btn.innerHTML = `<i class="fas fa-dharmachakra fa-spin"></i>`; btn.style.pointerEvents = "none";
            status.style.opacity = 1; status.innerText = i18n[currentLang].searchStatus;

            fetch(`${API_BASE}/api/trigger_crawl`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true', 'Bypass-Tunnel-Reminder': 'true' }, body: JSON.stringify({ target: target, force: true }) })
            .then(res => res.json())
            .then(data => { if(data.status !== "ERROR") { status.innerText = "Success."; status.style.color = '#8C2B24'; loadDynamicCacheList(); } else throw new Error(); })
            .catch(err => { status.innerHTML = `Error. <a href="${API_BASE}/api/cache_list" target="_blank" class="underline font-bold text-yihe-red">Fix Tunnel</a>`; })
            .finally(() => { btn.innerHTML = `<i class="fas fa-search"></i>`; btn.style.pointerEvents = "auto"; searchInput.value = ''; setTimeout(() => status.style.opacity = 0, 5000); });
        }

        // 散文生成
        function updateScatteredFlow(data) {
            const container = document.getElementById('scatter-container');
            container.innerHTML = '';
            
            const dnaList = data.pcg_dna || [];
            const techCards = data.tech_cards || [];
            let allItems = [...dnaList, ...techCards];

            if (allItems.length === 0) {
                container.innerHTML = `<div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 text-yihe-ink/30 tracking-[0.5em] text-2xl font-light font-serif">${currentLang === 'zh' ? '无确切法式矩阵' : 'No Matrix Found'}</div>`;
                return;
            }

            const dict = i18n[currentLang];
            const name = data.name ? (data.name[currentLang] || data.name.zh || "此殿宇") : "此殿宇";
            
            let html = `<div class="w-full text-center max-w-3xl mx-auto mb-20 text-lg leading-loose font-light opacity-80 reveal-up">
                <span class="font-bold text-xl mx-1">${dict.scatterNarrativePrefix} ${name}</span> ${dict.scatterNarrativeMiddle}
            </div>`;
            
            container.innerHTML = html;

            allItems.forEach((item, index) => {
                const label = currentLang === 'en' ? (item.param_name || item.label?.en || item.label_zh) : (item.label_zh || item.param_name || item.label?.zh);
                const value = currentLang === 'en' ? (item.value?.en || item.value) : (item.value?.zh || item.value);
                
                const verb = dict.scatterPrefixes[index % dict.scatterPrefixes.length];
                const comp = dict.scatterComplements[(index + 2) % dict.scatterComplements.length];
                
                const isLeftward = index % 2 === 0;
                const leftPos = isLeftward ? (10 + Math.random() * 25) : (50 + Math.random() * 30);
                const topPos = (index * (120 / allItems.length)) + (Math.random() * 15) + 20;

                const div = document.createElement('div');
                div.className = "scatter-node hover-trigger";
                div.style.left = `${leftPos}%`;
                div.style.top = `${topPos}%`;

                const sealHtml = Math.random() > 0.6 ? `<span class="scatter-seal">${currentLang === 'zh' ? '法式' : 'RULE'}</span>` : '';
                const descHtml = currentLang === 'zh' ? `以此构筑${comp}` : `Building with this${comp}`;

                div.innerHTML = `
                    <div class="scatter-prefix">${verb}</div>
                    <div class="flex items-end">
                        <span class="scatter-label">${label}</span>${sealHtml}
                    </div>
                    <div class="scatter-value">${value}</div>
                    <div class="scatter-desc">${descHtml}</div>
                `;
                container.appendChild(div);
            });
            
            const requiredHeight = Math.max(120, allItems.length * 25);
            container.style.minHeight = `${requiredHeight}vh`;
            bindCursorEvents();
        }

        // 统一渲染
        async function renderUI(item, skipAnimation) {
            if (currentTimer) clearInterval(currentTimer); currentData = item; 
            const text = item.content ? (item.content[currentLang] || item.content.zh || "") : "";
            const nameDisp = item.name ? (item.name[currentLang] || item.name.zh || "佚名") : "佚名";
            
            document.getElementById('target-name-1').innerText = nameDisp;
            
            // 水印 (英文模式下截取前几个字母)
            if (currentLang === 'zh') {
                document.getElementById('bg-watermark-1').innerText = nameDisp.charAt(0) || "史";
                document.getElementById('bg-watermark-2').innerText = nameDisp.charAt(nameDisp.length-1) || "构";
            } else {
                document.getElementById('bg-watermark-1').innerText = nameDisp.substring(0, 2).toUpperCase() || "HI";
                document.getElementById('bg-watermark-2').innerText = nameDisp.substring(0, 2).toUpperCase() || "AR";
            }
            
            updateScatteredFlow(item);

            // 卫星底图
            let lat = 39.916, lng = 116.390; 
            if (item.academic_proof?.coordinates) { 
                lat = item.academic_proof.coordinates.lat; lng = item.academic_proof.coordinates.lng; 
                document.getElementById('geo-coords').innerText = `${lat.toFixed(4)} , ${lng.toFixed(4)}`;
            } else { document.getElementById('geo-coords').innerText = currentLang === 'zh' ? `散于太虚` : `Unknown`; }
            document.getElementById('satellite-map').src = `https://static-maps.yandex.ru/1.x/?ll=${lng},${lat}&z=17&l=sat`;

            // 动态抓取维基百科图片！
            const img1 = document.getElementById('collage-img-1');
            const img2 = document.getElementById('collage-img-2');
            
            // 设置默认优美降级图
            const fallbackImgs = [
                "https://images.unsplash.com/photo-1542856391-010fb87dcfed?q=80&w=800&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1583205739958-692b2d6cc5fb?q=80&w=800&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1508804185872-d7badad00f7d?q=80&w=800&auto=format&fit=crop",
                "https://images.unsplash.com/photo-1574007557343-7f2a1eb3d5a4?q=80&w=800&auto=format&fit=crop"
            ];
            
            const searchName = item.name ? (item.name.zh || item.name.en || nameDisp) : nameDisp;
            
            // 异步获取，先给备用图
            img1.src = fallbackImgs[Math.floor(Math.random() * fallbackImgs.length)];
            img2.src = fallbackImgs[Math.floor(Math.random() * fallbackImgs.length)];
            
            fetchWikiImage(searchName).then(wikiUrl => {
                if (wikiUrl) {
                    img1.src = wikiUrl;
                    // 如果有图，再稍微放大一点增加质感
                    img1.classList.add('shadow-2xl');
                }
            });

            // 打字机
            const contentBox = document.getElementById('content-display');
            if (skipAnimation) { 
                contentBox.innerHTML = text; 
            } else {
                let i = 0; contentBox.innerHTML = '<span class="cursor-blink"></span>'; 
                currentTimer = setInterval(() => { 
                    if (i < text.length) { 
                        contentBox.innerHTML = text.substring(0, i + 1) + '<span class="cursor-blink"></span>'; 
                        i++; 
                    } else { 
                        clearInterval(currentTimer); 
                        const cursorObj = contentBox.querySelector('.cursor-blink'); 
                        if (cursorObj) cursorObj.style.display = 'none'; 
                    } 
                }, currentLang === 'en' ? 10 : 30); // 英文快一点
            }
        }

        function init() { 
            loadDynamicCacheList(); 
            document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') executeHarvest(); }); 
        }
        window.onload = init;
    </script>
</body>
