    <script>
        // 🔒 1. 核心加密算法 (不变)
        const AES_SECRET_KEY = "PalaceDigiSuperSecretKey32Bytes!";

        async function decryptPayload(base64Ciphertext) {
            try {
                const binaryString = atob(base64Ciphertext);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const iv = bytes.slice(0, 12); const data = bytes.slice(12);
                const enc = new TextEncoder();
                const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(AES_SECRET_KEY), "AES-GCM", false, ["decrypt"]);
                const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, keyMaterial, data);
                return JSON.parse(new TextDecoder().decode(decryptedBuffer));
            } catch (e) {
                console.error("解密失败", e); return { name: { zh: "真迹损毁 (DATA_CORRUPTED)" } };
            }
        }

        let currentLang = 'zh'; 
        function toggleLang(lang) {
            currentLang = lang;
            document.getElementById('btn-zh').className = lang === 'zh' ? "text-zhusha-500 font-bold transition-all hover:scale-110" : "text-ink-500 transition-all hover:scale-110";
            document.getElementById('btn-en').className = lang === 'en' ? "text-zhusha-500 font-bold transition-all hover:scale-110" : "text-xs text-ink-500 transition-all hover:scale-110";
            document.querySelectorAll('.lang-zh').forEach(el => el.style.display = lang === 'zh' ? 'inline' : 'none');
            document.querySelectorAll('.lang-en').forEach(el => el.style.display = lang === 'en' ? 'inline' : 'none');
            if (currentData) renderUI(currentData, true);
        }

        const BMOB_APP_ID = "d6f83c6438f18df723076957e3c280c2"; const BMOB_REST_KEY = "c6aa64c596088d8d724243a98d53fcd6";
        const currentHost = window.location.hostname;
        const CPOLAR_URL = "https://3a480289.r6.cpolar.top"; 
        const API_BASE = (currentHost === "localhost" || currentHost === "127.0.0.1" || currentHost === "") ? "http://127.0.0.1:5000" : CPOLAR_URL;
        
        let currentTimer = null; let currentSimInt = null; let currentData = null; let globalCloudNodes = [];

        function closeAllDrawers() {
            document.getElementById('drawer-overlay').classList.remove('active');
            document.getElementById('academic-drawer').classList.remove('active');
            document.getElementById('top-3d-drawer').classList.remove('active');
        }

        // 🌟 2. 核心 3D 引擎 - 纸面水墨风格 
        let scene, camera, renderer, ancientBuildingGroup;
        let particles, targetPositions, currentPositions, originalVelocities;
        let scanState = 0; let wireframeMeshes = []; const pCount = 8000; 

        // 水墨色粒子
        const INK_COLOR = 0x2C2A26; 

        function init3D() {
            const container = document.getElementById('top-hologram-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight || 1.7, 0.1, 1000);
            camera.position.set(0, 8, 20); camera.lookAt(0, 0, 0);

            // 背景透明，融入外层的浅色背景
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth || 800, container.clientHeight || 400);
            container.appendChild(renderer.domElement);

            ancientBuildingGroup = new THREE.Group();
            scene.add(ancientBuildingGroup);

            buildDynamicModel([]); animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (ancientBuildingGroup) ancientBuildingGroup.rotation.y += 0.003; 

            if (particles && scanState > 0) {
                const positions = particles.geometry.attributes.position.array;
                if (scanState === 1) { 
                    for(let i=0; i<pCount; i++) {
                        positions[i*3] += originalVelocities[i*3]; positions[i*3+1] += originalVelocities[i*3+1]; positions[i*3+2] += originalVelocities[i*3+2];
                        if (positions[i*3] > 30 || positions[i*3] < -30) originalVelocities[i*3] *= -1;
                        if (positions[i*3+1] > 25 || positions[i*3+1] < -10) originalVelocities[i*3+1] *= -1;
                        if (positions[i*3+2] > 30 || positions[i*3+2] < -30) originalVelocities[i*3+2] *= -1;
                    }
                } else if (scanState === 2 || scanState === 3) { 
                    for(let i=0; i<pCount; i++) {
                        positions[i*3] += (targetPositions[i*3] - positions[i*3]) * 0.03; 
                        positions[i*3+1] += (targetPositions[i*3+1] - positions[i*3+1]) * 0.03;
                        positions[i*3+2] += (targetPositions[i*3+2] - positions[i*3+2]) * 0.03;
                    }
                    if (scanState === 3) { wireframeMeshes.forEach(m => { if (m.material.opacity < (m.isHighlight ? 0.8 : 0.2)) m.material.opacity += 0.01; }); }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }

        function buildDynamicModel(dnaList) {
            while(ancientBuildingGroup.children.length > 0) ancientBuildingGroup.remove(ancientBuildingGroup.children[0]); 
            wireframeMeshes = [];
            // 线框变为古铜色/墨色
            const material = new THREE.MeshBasicMaterial({ color: 0xB89451, wireframe: true, transparent: true, opacity: 0 });
            const highlightMaterial = new THREE.MeshBasicMaterial({ color: 0x5C5955, wireframe: true, transparent: true, opacity: 0 });

            let w = 5, d = 3, h = 1, isTulouOrRound = false; 
            if (dnaList && dnaList.length > 0) {
                dnaList.forEach(p => {
                    const name = p.param_name || ""; const valStr = String(p.value || ""); const num = parseFloat(valStr.replace(/[^\d.]/g, ''));
                    if (!isNaN(num)) {
                        if (name.includes("WIDTH") || name.includes("SPAN") || name.includes("DIAMETER") || name.includes("面阔")) w = num;
                        if (name.includes("DEPTH") || name.includes("THICKNESS") || name.includes("进深")) d = num;
                        if (name.includes("BASE_H") || name.includes("HEIGHT") || name.includes("高")) h = num;
                    }
                    if(valStr.includes("土楼") || name.includes("DIAMETER") || valStr.includes("圆")) isTulouOrRound = true;
                });
            }

            const scaleFactor = 10 / Math.max(w, d, h, 1); 
            const drawW = w * scaleFactor, drawD = d * scaleFactor, drawH = h * scaleFactor;

            if (isTulouOrRound) {
                const mesh = new THREE.Mesh(new THREE.CylinderGeometry(drawW/2, drawW/2, drawH * 3, 24), highlightMaterial);
                mesh.isHighlight = true; wireframeMeshes.push(mesh); ancientBuildingGroup.add(mesh);
            } else {
                const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(drawW + 1.5, drawH, drawD + 1.5), highlightMaterial);
                baseMesh.position.y = -drawH/2; baseMesh.isHighlight = true; wireframeMeshes.push(baseMesh); ancientBuildingGroup.add(baseMesh);
                const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(drawW, 3, drawD), material);
                bodyMesh.position.y = 1.5; bodyMesh.isHighlight = false; wireframeMeshes.push(bodyMesh); ancientBuildingGroup.add(bodyMesh);
                const roofMesh = new THREE.Mesh(new THREE.CylinderGeometry(drawW * 0.3, drawW/2 + 1, 2, 4), highlightMaterial);
                roofMesh.position.y = 4; roofMesh.rotation.y = Math.PI / 4; roofMesh.isHighlight = true; wireframeMeshes.push(roofMesh); ancientBuildingGroup.add(roofMesh);
            }
            ancientBuildingGroup.position.y = -1; 

            currentPositions = new Float32Array(pCount * 3); targetPositions = new Float32Array(pCount * 3); originalVelocities = new Float32Array(pCount * 3);
            for (let i = 0; i < pCount; i++) {
                currentPositions[i*3] = (Math.random() - 0.5) * 60; currentPositions[i*3+1] = (Math.random() - 0.5) * 60 + 10; currentPositions[i*3+2] = (Math.random() - 0.5) * 60;
                originalVelocities[i*3] = (Math.random() - 0.5) * 0.6; originalVelocities[i*3+1] = (Math.random() - 0.5) * 0.6; originalVelocities[i*3+2] = (Math.random() - 0.5) * 0.6;
                let tx, ty, tz;
                if (isTulouOrRound) {
                    const r = drawW/2 * (0.85 + Math.random() * 0.15); const angle = Math.random() * Math.PI * 2;
                    tx = r * Math.cos(angle); ty = (Math.random() - 0.5) * (drawH * 3); tz = r * Math.sin(angle);
                } else {
                    const part = Math.random();
                    if (part < 0.3) { tx = (Math.random() - 0.5) * (drawW + 1.5); ty = -drawH/2 + (Math.random() - 0.5) * drawH; tz = (Math.random() - 0.5) * (drawD + 1.5); } 
                    else if (part < 0.7) { if (Math.random() > 0.5) { tx = (Math.random() > 0.5 ? 1 : -1) * drawW/2; ty = 1.5 + (Math.random() - 0.5) * 3; tz = (Math.random() - 0.5) * drawD; } else { tx = (Math.random() - 0.5) * drawW; ty = 1.5 + (Math.random() - 0.5) * 3; tz = (Math.random() > 0.5 ? 1 : -1) * drawD/2; } } 
                    else { const r = Math.random() * (drawW/2 + 1); const angle = Math.random() * Math.PI * 2; tx = r * Math.cos(angle); ty = 4 + (1 - r/(drawW/2+1)) * 2; tz = r * Math.sin(angle); }
                }
                targetPositions[i*3] = tx; targetPositions[i*3+1] = ty; targetPositions[i*3+2] = tz;
            }
            const geometry = new THREE.BufferGeometry(); geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            particles = new THREE.Points(geometry, new THREE.PointsMaterial({ color: INK_COLOR, size: 0.06, transparent: true, opacity: 0.7, blending: THREE.NormalBlending }));
            ancientBuildingGroup.add(particles);
        }

        // 🌟 3. 数据拉取
        async function loadDynamicCacheList() {
            const list = document.getElementById('file-list');
            list.innerHTML = `<div class="text-sm text-gold-900 text-center mt-10 animate-pulse tracking-widest">翻阅简牍中...</div>`; 
            try {
                const res = await fetch("https://api.bmobcloud.com/1/classes/BuildingArchive?order=-updatedAt&limit=50", {
                    method: 'GET', headers: { "X-Bmob-Application-Id": BMOB_APP_ID, "X-Bmob-REST-API-Key": BMOB_REST_KEY, "Content-Type": "application/json" }
                });
                if (!res.ok) throw new Error("API Error");
                const data = await res.json();
                
                globalCloudNodes = [];
                for (let item of data.results || []) {
                    if (item.payload_encrypted) item.payload = await decryptPayload(item.payload_encrypted);
                    else if (!item.payload && !item.payload_encrypted) continue; 
                    globalCloudNodes.push(item);
                }
                document.getElementById('sync-status').innerText = "已连结";
                document.getElementById('sync-status').classList.replace('text-gold-900', 'text-zhusha-500');
                renderNodeList(globalCloudNodes);
            } catch (error) {
                document.getElementById('sync-status').innerText = "断开";
                document.getElementById('sync-status').classList.replace('text-gold-900', 'text-ink-100');
                list.innerHTML = `<div class="text-xs text-zhusha-500 p-2 mt-4 text-center">无法获取云端玉简</div>`;
            }
        }

        function renderNodeList(nodes) {
            const list = document.getElementById('file-list'); list.innerHTML = ""; 
            if (nodes.length === 0) { list.innerHTML = `<div class="text-sm text-ink-100 text-center p-4 mt-4 tracking-widest">空无一物</div>`; return; }
            nodes.forEach((item) => {
                const b = item.payload; if(!b) return; 
                const div = document.createElement('div');
                div.className = "list-item-pro p-3 cursor-pointer flex flex-col gap-1 relative";
                const nodeID = item.objectId.substring(0, 6).toUpperCase();
                const nameDisp = b.name ? (b.name[currentLang] || b.name.zh) : "佚名";
                div.innerHTML = `
                    <div class="flex justify-between items-center text-[10px] font-mono text-ink-100 pl-1">
                        <span>NO. ${nodeID}</span>
                    </div>
                    <div class="text-[16px] font-bold text-ink-900 uppercase truncate pl-1 tracking-widest">${nameDisp}</div>
                `;
                div.onclick = () => renderUI(b, false);
                list.appendChild(div);
            });
        }

        function executeHarvest() {
            const searchInput = document.getElementById('searchInput'); const target = searchInput.value.trim(); if (!target) return;
            const btn = document.getElementById('searchBtn');
            btn.innerText = "神机推演中..."; btn.style.pointerEvents = "none"; btn.classList.add('opacity-50');
            document.getElementById('satellite-wrapper').classList.remove('active'); document.getElementById('no-img-msg').style.display = "flex";
            
            fetchData(target, true).finally(() => {
                btn.innerHTML = `<span class="lang-zh">起 卦 勘 测</span>`;
                btn.style.pointerEvents = "auto"; btn.classList.remove('opacity-50'); searchInput.value = ''; loadDynamicCacheList();
            });
        }

        async function fetchData(name, force = false) {
            if (currentTimer) clearInterval(currentTimer); if (currentSimInt) clearInterval(currentSimInt);
            // 垂直排版文字如果太长需要换行，或者这里给个短状态
            document.getElementById('target-name').innerText = "推演中"; document.getElementById('target-name').style.opacity = 1;
            document.getElementById('scan-state').innerText = "勘测中";
            document.getElementById('content-display').innerHTML = ""; document.getElementById('json-stream').innerText = "/* AWAITING_DIVINE_COMMAND... */";
            document.getElementById('btn-open-drawer').classList.add('hidden'); document.getElementById('btn-open-3d').classList.add('hidden');
            
            let progress = 0; const pBar = document.getElementById('progress-bar'); const pText = document.getElementById('progress-text'); const pLog = document.getElementById('npu-log');
            pLog.innerText = `> 正在剥离 '${name}' 物理维度...`;
            currentSimInt = setInterval(() => { if (progress < 95) { progress += (Math.random() * 5); if(progress > 95) progress = 95; pBar.style.width = `${progress}%`; pText.innerText = `${Math.floor(progress)}%`; } }, 800);

            try {
                const res = await fetch(`${API_BASE}/api/trigger_crawl`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true', 'Bypass-Tunnel-Reminder': 'true' }, body: JSON.stringify({ target: name, force: force }) });
                const data = await res.json();
                clearInterval(currentSimInt); pBar.style.width = "100%"; pText.innerText = "100%"; pLog.innerText = "> 卷宗已封印。";
                if (data.status !== "ERROR") { currentData = data.payload; renderUI(currentData, false); if (data.status === "GENERATED") setTimeout(loadDynamicCacheList, 1500); } else throw new Error("Error");
            } catch (err) {
                clearInterval(currentSimInt); document.getElementById('target-name').innerText = "阵法溃散"; document.getElementById('scan-state').innerText = "SIGNAL_LOST";
                pLog.innerText = "> 灵力枯竭"; pBar.style.width = "0%"; pText.innerText = "ERR";
                document.getElementById('content-display').innerHTML = `<div class="border border-zhusha-500 p-4 text-zhusha-500 text-sm leading-relaxed mt-4"><b>⚠️ 神谕被界外结界拦截 (隧道假跨域)</b><br><br>若要在凡间展示，请先<b>点击下方铭文打通穿透法阵</b>！<br><a href="${API_BASE}/api/cache_list" target="_blank" class="inline-block mt-3 px-4 py-2 border border-zhusha-500 hover:bg-zhusha-500 hover:text-white transition-colors">👉 点我打通结界 (Visit Site)</a></div>`;
            }
        }

        function renderUI(item, skipAnimation) {
            if (currentTimer) clearInterval(currentTimer); currentData = item; 
            const contentMap = item.content || {}; const text = contentMap[currentLang] || contentMap.zh || "古籍损毁";
            
            document.getElementById('target-name').innerText = item.name ? (item.name[currentLang] || item.name.zh) : "佚名";
            document.getElementById('target-name').style.opacity = 1;
            document.getElementById('json-stream').innerText = JSON.stringify(item, null, 2);
            document.getElementById('btn-open-drawer').classList.remove('hidden'); document.getElementById('btn-open-3d').classList.remove('hidden');

            buildDynamicModel(item.pcg_dna || []);
            let lat = 39.9, lng = 116.4; if (item.academic_proof?.coordinates) { lat = item.academic_proof.coordinates.lat || lat; lng = item.academic_proof.coordinates.lng || lng; }
            const wrapper = document.getElementById('satellite-wrapper'); const mapImg = document.getElementById('satellite-map');
            mapImg.src = `https://static-maps.yandex.ru/1.x/?ll=${lng},${lat}&z=17&l=sat`;
            mapImg.onload = () => { wrapper.classList.add('active'); document.getElementById('no-img-msg').style.display = 'none'; };

            document.getElementById('scan-state').innerText = "星宿锁定"; document.getElementById('scan-state').classList.replace('text-ink-500', 'text-gold-900');
            
            const contentBox = document.getElementById('content-display');
            if (skipAnimation) { contentBox.innerHTML = text; updateDrawer(item); } 
            else {
                let i = 0;
                currentTimer = setInterval(() => { if (i < text.length) { contentBox.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>'; i++; contentBox.scrollTop = contentBox.scrollHeight; } else { clearInterval(currentTimer); const cursor = contentBox.querySelector('.cursor'); if (cursor) cursor.style.display = 'none'; updateDrawer(item); } }, 15); 
            }
        }

        function updateDrawer(data) {
            document.getElementById('drawer-name').innerText = data.name ? (data.name[currentLang] || data.name?.zh) : "UNKNOWN";
            const container = document.getElementById('pcg-dna-container'); container.innerHTML = ""; 
            const dnaList = data.pcg_dna || [];
            if (Array.isArray(dnaList) && dnaList.length > 0) {
                dnaList.forEach(p => {
                    const label = currentLang === 'en' ? (p.param_name || "PARAM") : (p.label_zh || "参数");
                    container.innerHTML += `<div class="flex justify-between items-end border-b border-gold-500/20 pb-3 mt-2"><div class="flex flex-col"><span class="text-sm text-ink-900 font-bold">${label}</span><span class="text-[10px] font-mono text-ink-100">${p.param_name || "VAR"}</span></div><span class="text-[15px] font-bold text-zhusha-500 font-mono">${p.value || "---"}</span></div>`;
                });
            } else if (data.tech_cards?.length > 0) {
                data.tech_cards.forEach(card => {
                    const label = card.label?.[currentLang] || card.label?.zh || card.label || "属性"; const value = card.value?.[currentLang] || card.value?.zh || card.value || "---";
                    container.innerHTML += `<div class="flex justify-between items-end border-b border-gold-500/20 pb-3 mt-2"><div class="flex flex-col"><span class="text-sm text-ink-900 font-bold">${label}</span><span class="text-[10px] font-mono text-ink-100">LEGACY</span></div><span class="text-[15px] font-bold text-zhusha-500 font-mono">${value}</span></div>`;
                });
            } else container.innerHTML = `<div class="text-ink-100 text-sm mt-4">此卷宗尚未凝聚营造矩阵</div>`;

            if (data.academic_proof?.coordinates) {
                const coords = data.academic_proof.coordinates;
                container.innerHTML += `<div class="flex justify-between items-end border-t border-paper-900 mt-6 pt-4"><div class="flex flex-col"><span class="text-xs text-ink-500">堪舆坐标</span></div><span class="text-sm font-bold text-gold-900 font-mono">${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}</span></div>`;
            }
        }

        function openTopDrawer() {
            document.getElementById('drawer-overlay').classList.add('active'); document.getElementById('top-3d-drawer').classList.add('active');
            const c = document.getElementById('top-hologram-container');
            if(camera && renderer) { camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(c.clientWidth, c.clientHeight); }

            scanState = 1; const statusEl = document.getElementById('hologram-status');
            statusEl.innerHTML = `>>> 泼墨聚影中...`;
            setTimeout(() => { scanState = 2; statusEl.innerHTML = `>>> 勾勒建筑结构中...`; }, 3000);
            setTimeout(() => { scanState = 3; statusEl.innerHTML = `>>> 营造推演完毕。`; }, 6000);
        }

        function init() { init3D(); loadDynamicCacheList(); document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') executeHarvest(); }); }
        window.onresize = () => { if(camera && renderer && document.getElementById('top-3d-drawer').classList.contains('active')) { const c = document.getElementById('top-hologram-container'); camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(c.clientWidth, c.clientHeight); } };
        window.onload = init;
    </script>
</body>
