        .reveal-left { opacity: 0; transform: translateX(50px); transition: all 1.2s ease-out; }

        .reveal-right { opacity: 0; transform: translateX(-50px); transition: all 1.2s ease-out; }

    <script>
        // --- 0. 滚动涌现动画观察器 (Intersection Observer) ---
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);

        function observeNewElements() {
            document.querySelectorAll('.reveal-up, .reveal-blur, .reveal-left, .reveal-right').forEach(el => observer.observe(el));
        }
        document.addEventListener("DOMContentLoaded", observeNewElements);

        // --- 1. 核心加密 (不可动) ---
        const AES_SECRET_KEY = "PalaceDigiSuperSecretKey32Bytes!";
        async function decryptPayload(base64Ciphertext) {
            try {
                const binaryString = atob(base64Ciphertext); const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const iv = bytes.slice(0, 12); const data = bytes.slice(12); const enc = new TextEncoder();
                const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(AES_SECRET_KEY), "AES-GCM", false, ["decrypt"]);
                const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, keyMaterial, data);
                return JSON.parse(new TextDecoder().decode(decryptedBuffer));
            } catch (e) { return { name: { zh: "真迹损毁" } }; }
        }

        let currentLang = 'zh'; 
        function toggleLang(lang) {
            currentLang = lang;
            document.getElementById('btn-zh').style.background = lang === 'zh' ? '#8C2B24' : 'rgba(242, 239, 233, 0.6)';
            document.getElementById('btn-zh').style.color = lang === 'zh' ? '#F2EFE9' : '#A38045';
            document.getElementById('btn-en').style.background = lang === 'en' ? '#8C2B24' : 'rgba(242, 239, 233, 0.6)';
            document.getElementById('btn-en').style.color = lang === 'en' ? '#F2EFE9' : '#A38045';
            document.querySelectorAll('.lang-zh').forEach(el => el.style.display = lang === 'zh' ? 'inline' : 'none');
            document.querySelectorAll('.lang-en').forEach(el => el.style.display = lang === 'en' ? 'inline' : 'none');
            if (currentData) renderUI(currentData, true);
        }

        const BMOB_APP_ID = "d6f83c6438f18df723076957e3c280c2"; const BMOB_REST_KEY = "c6aa64c596088d8d724243a98d53fcd6";
        const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.hostname === "") ? "http://127.0.0.1:5000" : "https://3a480289.r6.cpolar.top";
        
        let currentTimer = null; let currentData = null; let globalCloudNodes = [];

        // --- 2. 纯净水墨 3D 引擎 ---
        let scene, camera, renderer, ancientBuildingGroup;
        let particles, targetPositions, currentPositions, originalVelocities;
        let scanState = 0; let wireframeMeshes = []; const pCount = 8000; 

        function init3D() {
            const container = document.getElementById('top-hologram-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight || 2, 0.1, 1000);
            camera.position.set(0, 8, 28); camera.lookAt(0, -2, 0);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth || 1000, container.clientHeight || 600);
            container.appendChild(renderer.domElement);
            ancientBuildingGroup = new THREE.Group();
            scene.add(ancientBuildingGroup);
            buildDynamicModel([]); animate3D();
            window.addEventListener('resize', () => { camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (ancientBuildingGroup) ancientBuildingGroup.rotation.y += 0.002; 
            if (particles && scanState > 0) {
                const positions = particles.geometry.attributes.position.array;
                if (scanState === 1) { 
                    for(let i=0; i<pCount; i++) {
                        positions[i*3] += originalVelocities[i*3]; positions[i*3+1] += originalVelocities[i*3+1]; positions[i*3+2] += originalVelocities[i*3+2];
                        if (positions[i*3] > 30 || positions[i*3] < -30) originalVelocities[i*3] *= -1;
                        if (positions[i*3+1] > 25 || positions[i*3+1] < -10) originalVelocities[i*3+1] *= -1;
                        if (positions[i*3+2] > 30 || positions[i*3+2] < -30) originalVelocities[i*3+2] *= -1;
                    }
                } else if (scanState === 2 || scanState === 3) { 
                    for(let i=0; i<pCount; i++) {
                        positions[i*3] += (targetPositions[i*3] - positions[i*3]) * 0.03; positions[i*3+1] += (targetPositions[i*3+1] - positions[i*3+1]) * 0.03; positions[i*3+2] += (targetPositions[i*3+2] - positions[i*3+2]) * 0.03;
                    }
                    if (scanState === 3) { wireframeMeshes.forEach(m => { if (m.material.opacity < (m.isHighlight ? 0.6 : 0.1)) m.material.opacity += 0.01; }); }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }

        function buildDynamicModel(dnaList) {
            while(ancientBuildingGroup.children.length > 0) ancientBuildingGroup.remove(ancientBuildingGroup.children[0]); 
            wireframeMeshes = [];
            const material = new THREE.MeshBasicMaterial({ color: 0xA38045, wireframe: true, transparent: true, opacity: 0 }); // 黯金线
            const highlightMaterial = new THREE.MeshBasicMaterial({ color: 0x2C2825, wireframe: true, transparent: true, opacity: 0 }); // 墨线

            let w = 5, d = 3, h = 1, isTulouOrRound = false; 
            if (dnaList && dnaList.length > 0) {
                dnaList.forEach(p => {
                    const name = p.param_name || ""; const valStr = String(p.value || ""); const num = parseFloat(valStr.replace(/[^\d.]/g, ''));
                    if (!isNaN(num)) {
                        if (name.includes("WIDTH") || name.includes("SPAN") || name.includes("DIAMETER") || name.includes("面阔")) w = num;
                        if (name.includes("DEPTH") || name.includes("THICKNESS") || name.includes("进深")) d = num;
                        if (name.includes("BASE_H") || name.includes("HEIGHT") || name.includes("高")) h = num;
                    }
                    if(valStr.includes("土楼") || name.includes("DIAMETER") || valStr.includes("圆")) isTulouOrRound = true;
                });
            }

            const scaleFactor = 12 / Math.max(w, d, h, 1); const drawW = w * scaleFactor, drawD = d * scaleFactor, drawH = h * scaleFactor;

            if (isTulouOrRound) {
                const mesh = new THREE.Mesh(new THREE.CylinderGeometry(drawW/2, drawW/2, drawH * 3, 24), highlightMaterial); mesh.isHighlight = true; wireframeMeshes.push(mesh); ancientBuildingGroup.add(mesh);
            } else {
                const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(drawW + 1.5, drawH, drawD + 1.5), highlightMaterial); baseMesh.position.y = -drawH/2; baseMesh.isHighlight = true; wireframeMeshes.push(baseMesh); ancientBuildingGroup.add(baseMesh);
                const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(drawW, 3, drawD), material); bodyMesh.position.y = 1.5; bodyMesh.isHighlight = false; wireframeMeshes.push(bodyMesh); ancientBuildingGroup.add(bodyMesh);
                const roofMesh = new THREE.Mesh(new THREE.CylinderGeometry(drawW * 0.3, drawW/2 + 1, 2, 4), highlightMaterial); roofMesh.position.y = 4; roofMesh.rotation.y = Math.PI / 4; roofMesh.isHighlight = true; wireframeMeshes.push(roofMesh); ancientBuildingGroup.add(roofMesh);
            }
            ancientBuildingGroup.position.y = -3; 

            currentPositions = new Float32Array(pCount * 3); targetPositions = new Float32Array(pCount * 3); originalVelocities = new Float32Array(pCount * 3);
            for (let i = 0; i < pCount; i++) {
                currentPositions[i*3] = (Math.random() - 0.5) * 60; currentPositions[i*3+1] = (Math.random() - 0.5) * 60 + 10; currentPositions[i*3+2] = (Math.random() - 0.5) * 60;
                originalVelocities[i*3] = (Math.random() - 0.5) * 0.5; originalVelocities[i*3+1] = (Math.random() - 0.5) * 0.5; originalVelocities[i*3+2] = (Math.random() - 0.5) * 0.5;
                let tx, ty, tz;
                if (isTulouOrRound) {
                    const r = drawW/2 * (0.85 + Math.random() * 0.15); const angle = Math.random() * Math.PI * 2; tx = r * Math.cos(angle); ty = (Math.random() - 0.5) * (drawH * 3); tz = r * Math.sin(angle);
                } else {
                    const part = Math.random();
                    if (part < 0.3) { tx = (Math.random() - 0.5) * (drawW + 1.5); ty = -drawH/2 + (Math.random() - 0.5) * drawH; tz = (Math.random() - 0.5) * (drawD + 1.5); } 
                    else if (part < 0.7) { if (Math.random() > 0.5) { tx = (Math.random() > 0.5 ? 1 : -1) * drawW/2; ty = 1.5 + (Math.random() - 0.5) * 3; tz = (Math.random() - 0.5) * drawD; } else { tx = (Math.random() - 0.5) * drawW; ty = 1.5 + (Math.random() - 0.5) * 3; tz = (Math.random() > 0.5 ? 1 : -1) * drawD/2; } } 
                    else { const r = Math.random() * (drawW/2 + 1); const angle = Math.random() * Math.PI * 2; tx = r * Math.cos(angle); ty = 4 + (1 - r/(drawW/2+1)) * 2; tz = r * Math.sin(angle); }
                }
                targetPositions[i*3] = tx; targetPositions[i*3+1] = ty; targetPositions[i*3+2] = tz;
            }
            const geometry = new THREE.BufferGeometry(); geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            particles = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0x2C2825, size: 0.08, transparent: true, opacity: 0.7, blending: THREE.NormalBlending }));
            ancientBuildingGroup.add(particles);
        }

        // --- 3. 数据拉取 ---
        async function loadDynamicCacheList() {
            const list = document.getElementById('file-list');
            list.innerHTML = `<div class="text-lg text-yihe-text/40 py-8 tracking-[0.3em] font-serif animate-pulse">调取云端文献中...</div>`; 
            try {
                const res = await fetch("https://api.bmobcloud.com/1/classes/BuildingArchive?order=-updatedAt&limit=50", {
                    method: 'GET', headers: { "X-Bmob-Application-Id": BMOB_APP_ID, "X-Bmob-REST-API-Key": BMOB_REST_KEY, "Content-Type": "application/json" }
                });
                if (!res.ok) throw new Error("API Error");
                const data = await res.json();
                globalCloudNodes = [];
                for (let item of data.results || []) {
                    if (item.payload_encrypted) item.payload = await decryptPayload(item.payload_encrypted);
                    else if (!item.payload && !item.payload_encrypted) continue; 
                    globalCloudNodes.push(item);
                }
                document.getElementById('sync-status').innerText = "已连结";
                renderNodeList(globalCloudNodes);
            } catch (error) {
                document.getElementById('sync-status').innerText = "断开";
                list.innerHTML = `<div class="text-lg text-yihe-red py-8 font-serif">结界阻隔，无法获取。</div>`;
            }
        }

        function renderNodeList(nodes) {
            const list = document.getElementById('file-list'); list.innerHTML = ""; 
            if (nodes.length === 0) { list.innerHTML = `<div class="text-lg text-yihe-text/40 py-8">空无一物</div>`; return; }
            nodes.forEach((item) => {
                const b = item.payload; if(!b) return; 
                const div = document.createElement('div');
                div.className = "list-item-pro";
                const nameDisp = b.name ? (b.name[currentLang] || b.name.zh) : "佚名";
                div.innerHTML = `<span class="text-2xl font-bold font-serif">${nameDisp}</span><span class="block text-xs text-yihe-text/40 font-mono mt-2">NO.${item.objectId.substring(0,6).toUpperCase()}</span>`;
                
                // 核心：点击后展开长卷，并平滑滚动
                div.onclick = () => { 
                    renderUI(b, false); 
                    const flow = document.getElementById('narrative-flow');
                    flow.classList.remove('hidden');
                    document.getElementById('scroll-hint').classList.remove('hidden');
                    document.getElementById('nav-content').classList.remove('hidden');
                    document.getElementById('nav-3d').classList.remove('hidden');
                    document.getElementById('nav-dna').classList.remove('hidden');
                    
                    // 重新绑定观察器
                    setTimeout(() => { observeNewElements(); document.getElementById('chapter-history').scrollIntoView({ behavior: 'smooth' }); }, 100);
                };
                list.appendChild(div);
            });
        }

        function executeHarvest() {
            const searchInput = document.getElementById('searchInput'); const target = searchInput.value.trim(); if (!target) return;
            const btn = document.getElementById('searchBtn'); const log = document.getElementById('npu-log');
            btn.innerText = "算力凝结中..."; btn.style.pointerEvents = "none"; btn.classList.add('opacity-50');
            log.innerText = `STATUS: 正在剥离 '${target}' 的物理维度...`; log.classList.add('animate-pulse', 'text-yihe-red');

            fetch(`${API_BASE}/api/trigger_crawl`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true', 'Bypass-Tunnel-Reminder': 'true' }, body: JSON.stringify({ target: target, force: true }) })
            .then(res => res.json())
            .then(data => {
                if(data.status !== "ERROR") {
                    log.innerText = `STATUS: 卷宗已封印入库。`; log.classList.remove('animate-pulse', 'text-yihe-red');
                    loadDynamicCacheList();
                } else throw new Error();
            })
            .catch(err => {
                log.innerHTML = `⚠️ 神谕被界外结界拦截，<a href="${API_BASE}/api/cache_list" target="_blank" class="underline hover:text-yihe-red font-bold">请点击打通隧道</a>`;
                log.classList.remove('animate-pulse');
            })
            .finally(() => {
                btn.innerHTML = `<span class="lang-zh">起卦</span>`; btn.style.pointerEvents = "auto"; btn.classList.remove('opacity-50'); searchInput.value = '';
            });
        }

        // --- 4. 生成错落有致的诗意数据排版 ---
        function updatePoeticFlow(data) {
            const container = document.getElementById('pcg-dna-flow');
            container.innerHTML = '';
            
            const dnaList = data.pcg_dna || [];
            const techCards = data.tech_cards || [];
            let allItems = [...dnaList, ...techCards];

            if (allItems.length === 0) {
                container.innerHTML = `<div class="reveal-up text-center text-xl text-yihe-text/40 tracking-widest my-20 font-light">岁月斑驳，尚未解析出确切法式。</div>`;
                return;
            }

            // 左右交错生成散文句
            allItems.forEach((item, index) => {
                const isLeft = index % 2 === 0;
                const label = item.label_zh || item.param_name || item.label?.zh || item.label || "属性";
                const value = item.value?.zh || item.value || "---";
                
                const alignment = isLeft ? "self-start reveal-left" : "self-end reveal-right text-right";
                
                const html = `
                    <div class="${alignment} max-w-2xl mb-12">
                        <div class="text-xl md:text-3xl font-serif text-yihe-text tracking-[0.2em] font-light leading-relaxed">
                            其 <span class="font-bold text-2xl md:text-4xl text-yihe-text mx-2">${label}</span><br>
                            规制勘定为 <span class="font-mono font-bold text-3xl md:text-5xl text-yihe-red mx-2">${value}</span>。
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function renderUI(item, skipAnimation) {
            if (currentTimer) clearInterval(currentTimer); currentData = item; 
            const contentMap = item.content || {}; const text = contentMap[currentLang] || contentMap.zh || "古籍损毁，内容无法辨识。";
            
            const nameDisp = item.name ? (item.name[currentLang] || item.name.zh) : "佚名卷宗";
            document.getElementById('target-name').innerText = nameDisp;
            document.getElementById('bg-watermark').innerText = nameDisp; // 巨大水印
            
            // 构建 3D
            buildDynamicModel(item.pcg_dna || []);
            scanState = 1; setTimeout(() => { scanState = 2; }, 1000); setTimeout(() => { scanState = 3; }, 3000);

            // 构建诗意排版
            updatePoeticFlow(item);

            // 更新卫星坐标
            let lat = 39.9, lng = 116.4; 
            if (item.academic_proof?.coordinates) { 
                lat = item.academic_proof.coordinates.lat || lat; 
                lng = item.academic_proof.coordinates.lng || lng; 
                document.getElementById('geo-coords').innerText = `${lat.toFixed(4)} , ${lng.toFixed(4)}`;
            } else {
                document.getElementById('geo-coords').innerText = `无 迹 可 寻`;
            }
            const mapImg = document.getElementById('satellite-map');
            mapImg.src = `https://static-maps.yandex.ru/1.x/?ll=${lng},${lat}&z=16&l=sat`;

            // 文本打字机或直接显示
            const contentBox = document.getElementById('content-display');
            if (skipAnimation) { contentBox.innerHTML = text; } 
            else {
                let i = 0;
                currentTimer = setInterval(() => { 
                    if (i < text.length) { 
                        contentBox.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>'; 
                        i++; 
                    } else { 
                        clearInterval(currentTimer); 
                        const cursor = contentBox.querySelector('.cursor'); if (cursor) cursor.style.display = 'none'; 
                    } 
                }, 15); 
            }
        }

        function init() { init3D(); loadDynamicCacheList(); document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') executeHarvest(); }); }
        window.onload = init;
    </script>
</body>
</html>
