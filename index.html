    <script>
        // --- 动态背景图库 (高质感中国风建筑/风景) ---
        const bgLibrary = [
            "https://images.unsplash.com/photo-1542856391-010fb87dcfed?q=80&w=2000&auto=format&fit=crop", // 故宫角楼
            "https://images.unsplash.com/photo-1508804185872-d7badad00f7d?q=80&w=2000&auto=format&fit=crop", // 长城薄雾
            "https://images.unsplash.com/photo-1583205739958-692b2d6cc5fb?q=80&w=2000&auto=format&fit=crop", // 苏州园林
            "https://images.unsplash.com/photo-1574007557343-7f2a1eb3d5a4?q=80&w=2000&auto=format&fit=crop"  // 古典飞檐
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, observerOptions);
            document.querySelectorAll('.fade-up, .fade-left').forEach(el => observer.observe(el));
        });

        // --- 1. 核心加密 ---
        const AES_SECRET_KEY = "PalaceDigiSuperSecretKey32Bytes!";
        async function decryptPayload(base64Ciphertext) {
            try {
                const binaryString = atob(base64Ciphertext); const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const iv = bytes.slice(0, 12); const data = bytes.slice(12); const enc = new TextEncoder();
                const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(AES_SECRET_KEY), "AES-GCM", false, ["decrypt"]);
                const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, keyMaterial, data);
                return JSON.parse(new TextDecoder().decode(decryptedBuffer));
            } catch (e) { return { name: { zh: "真迹损毁 (DATA_CORRUPTED)" } }; }
        }

        let currentLang = 'zh'; 
        function toggleLang(lang) {
            currentLang = lang;
            document.getElementById('btn-zh').style.background = lang === 'zh' ? '#9B332B' : 'rgba(235, 231, 223, 0.85)';
            document.getElementById('btn-zh').style.color = lang === 'zh' ? '#EBE7DF' : '#9B332B';
            document.getElementById('btn-en').style.background = lang === 'en' ? '#9B332B' : 'rgba(235, 231, 223, 0.85)';
            document.getElementById('btn-en').style.color = lang === 'en' ? '#EBE7DF' : '#9B332B';
            document.querySelectorAll('.lang-zh').forEach(el => el.style.display = lang === 'zh' ? 'inline' : 'none');
            document.querySelectorAll('.lang-en').forEach(el => el.style.display = lang === 'en' ? 'inline' : 'none');
            if (currentData) renderUI(currentData, true);
        }

        const BMOB_APP_ID = "d6f83c6438f18df723076957e3c280c2"; const BMOB_REST_KEY = "c6aa64c596088d8d724243a98d53fcd6";
        const currentHost = window.location.hostname;
        const CPOLAR_URL = "https://3a480289.r6.cpolar.top"; 
        const API_BASE = (currentHost === "localhost" || currentHost === "127.0.0.1" || currentHost === "") ? "http://127.0.0.1:5000" : CPOLAR_URL;
        
        let currentTimer = null; let currentSimInt = null; let currentData = null; let globalCloudNodes = [];

        // --- 2. Three.js 水墨 3D ---
        let scene, camera, renderer, ancientBuildingGroup;
        let particles, targetPositions, currentPositions, originalVelocities;
        let scanState = 0; let wireframeMeshes = []; const pCount = 8000; 

        function init3D() {
            const container = document.getElementById('top-hologram-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight || 1.7, 0.1, 1000);
            camera.position.set(0, 10, 25); camera.lookAt(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth || 800, container.clientHeight || 600);
            container.appendChild(renderer.domElement);
            ancientBuildingGroup = new THREE.Group();
            scene.add(ancientBuildingGroup);
            buildDynamicModel([]); animate3D();
            window.addEventListener('resize', () => { camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (ancientBuildingGroup) ancientBuildingGroup.rotation.y += 0.002; 
            if (particles && scanState > 0) {
                const positions = particles.geometry.attributes.position.array;
                if (scanState === 1) { 
                    for(let i=0; i<pCount; i++) {
                        positions[i*3] += originalVelocities[i*3]; positions[i*3+1] += originalVelocities[i*3+1]; positions[i*3+2] += originalVelocities[i*3+2];
                        if (positions[i*3] > 30 || positions[i*3] < -30) originalVelocities[i*3] *= -1;
                        if (positions[i*3+1] > 25 || positions[i*3+1] < -10) originalVelocities[i*3+1] *= -1;
                        if (positions[i*3+2] > 30 || positions[i*3+2] < -30) originalVelocities[i*3+2] *= -1;
                    }
                } else if (scanState === 2 || scanState === 3) { 
                    for(let i=0; i<pCount; i++) {
                        positions[i*3] += (targetPositions[i*3] - positions[i*3]) * 0.04; positions[i*3+1] += (targetPositions[i*3+1] - positions[i*3+1]) * 0.04; positions[i*3+2] += (targetPositions[i*3+2] - positions[i*3+2]) * 0.04;
                    }
                    if (scanState === 3) { wireframeMeshes.forEach(m => { if (m.material.opacity < (m.isHighlight ? 0.7 : 0.15)) m.material.opacity += 0.01; }); }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }

        function buildDynamicModel(dnaList) {
            while(ancientBuildingGroup.children.length > 0) ancientBuildingGroup.remove(ancientBuildingGroup.children[0]); 
            wireframeMeshes = [];
            const material = new THREE.MeshBasicMaterial({ color: 0xB08E51, wireframe: true, transparent: true, opacity: 0 });
            const highlightMaterial = new THREE.MeshBasicMaterial({ color: 0x2C2A26, wireframe: true, transparent: true, opacity: 0 });

            let w = 5, d = 3, h = 1, isTulouOrRound = false; 
            if (dnaList && dnaList.length > 0) {
                dnaList.forEach(p => {
                    const name = p.param_name || ""; const valStr = String(p.value || ""); const num = parseFloat(valStr.replace(/[^\d.]/g, ''));
                    if (!isNaN(num)) {
                        if (name.includes("WIDTH") || name.includes("SPAN") || name.includes("DIAMETER") || name.includes("面阔")) w = num;
                        if (name.includes("DEPTH") || name.includes("THICKNESS") || name.includes("进深")) d = num;
                        if (name.includes("BASE_H") || name.includes("HEIGHT") || name.includes("高")) h = num;
                    }
                    if(valStr.includes("土楼") || name.includes("DIAMETER") || valStr.includes("圆")) isTulouOrRound = true;
                });
            }

            const scaleFactor = 12 / Math.max(w, d, h, 1); const drawW = w * scaleFactor, drawD = d * scaleFactor, drawH = h * scaleFactor;

            if (isTulouOrRound) {
                const mesh = new THREE.Mesh(new THREE.CylinderGeometry(drawW/2, drawW/2, drawH * 3, 24), highlightMaterial); mesh.isHighlight = true; wireframeMeshes.push(mesh); ancientBuildingGroup.add(mesh);
            } else {
                const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(drawW + 1.5, drawH, drawD + 1.5), highlightMaterial); baseMesh.position.y = -drawH/2; baseMesh.isHighlight = true; wireframeMeshes.push(baseMesh); ancientBuildingGroup.add(baseMesh);
                const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(drawW, 3, drawD), material); bodyMesh.position.y = 1.5; bodyMesh.isHighlight = false; wireframeMeshes.push(bodyMesh); ancientBuildingGroup.add(bodyMesh);
                const roofMesh = new THREE.Mesh(new THREE.CylinderGeometry(drawW * 0.3, drawW/2 + 1, 2, 4), highlightMaterial); roofMesh.position.y = 4; roofMesh.rotation.y = Math.PI / 4; roofMesh.isHighlight = true; wireframeMeshes.push(roofMesh); ancientBuildingGroup.add(roofMesh);
            }
            ancientBuildingGroup.position.y = -2; 

            currentPositions = new Float32Array(pCount * 3); targetPositions = new Float32Array(pCount * 3); originalVelocities = new Float32Array(pCount * 3);
            for (let i = 0; i < pCount; i++) {
                currentPositions[i*3] = (Math.random() - 0.5) * 60; currentPositions[i*3+1] = (Math.random() - 0.5) * 60 + 10; currentPositions[i*3+2] = (Math.random() - 0.5) * 60;
                originalVelocities[i*3] = (Math.random() - 0.5) * 0.5; originalVelocities[i*3+1] = (Math.random() - 0.5) * 0.5; originalVelocities[i*3+2] = (Math.random() - 0.5) * 0.5;
                let tx, ty, tz;
                if (isTulouOrRound) {
                    const r = drawW/2 * (0.85 + Math.random() * 0.15); const angle = Math.random() * Math.PI * 2; tx = r * Math.cos(angle); ty = (Math.random() - 0.5) * (drawH * 3); tz = r * Math.sin(angle);
                } else {
                    const part = Math.random();
                    if (part < 0.3) { tx = (Math.random() - 0.5) * (drawW + 1.5); ty = -drawH/2 + (Math.random() - 0.5) * drawH; tz = (Math.random() - 0.5) * (drawD + 1.5); } 
                    else if (part < 0.7) { if (Math.random() > 0.5) { tx = (Math.random() > 0.5 ? 1 : -1) * drawW/2; ty = 1.5 + (Math.random() - 0.5) * 3; tz = (Math.random() - 0.5) * drawD; } else { tx = (Math.random() - 0.5) * drawW; ty = 1.5 + (Math.random() - 0.5) * 3; tz = (Math.random() > 0.5 ? 1 : -1) * drawD/2; } } 
                    else { const r = Math.random() * (drawW/2 + 1); const angle = Math.random() * Math.PI * 2; tx = r * Math.cos(angle); ty = 4 + (1 - r/(drawW/2+1)) * 2; tz = r * Math.sin(angle); }
                }
                targetPositions[i*3] = tx; targetPositions[i*3+1] = ty; targetPositions[i*3+2] = tz;
            }
            const geometry = new THREE.BufferGeometry(); geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            particles = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0x2C2A26, size: 0.08, transparent: true, opacity: 0.6, blending: THREE.NormalBlending }));
            ancientBuildingGroup.add(particles);
        }

        // --- 3. 动态数据与叙事化处理 ---
        async function loadDynamicCacheList() {
            const list = document.getElementById('file-list');
            list.innerHTML = `<div class="text-sm text-yihe-text/40 py-8 text-center animate-pulse tracking-widest">翻阅藏经阁中...</div>`; 
            try {
                const res = await fetch("https://api.bmobcloud.com/1/classes/BuildingArchive?order=-updatedAt&limit=50", {
                    method: 'GET', headers: { "X-Bmob-Application-Id": BMOB_APP_ID, "X-Bmob-REST-API-Key": BMOB_REST_KEY, "Content-Type": "application/json" }
                });
                if (!res.ok) throw new Error("API Error");
                const data = await res.json();
                
                globalCloudNodes = [];
                for (let item of data.results || []) {
                    if (item.payload_encrypted) item.payload = await decryptPayload(item.payload_encrypted);
                    else if (!item.payload && !item.payload_encrypted) continue; 
                    globalCloudNodes.push(item);
                }
                document.getElementById('sync-status').innerText = "阵法结印 (SECURE)";
                document.getElementById('sync-status').classList.replace('text-yihe-border', 'text-yihe-gold');
                renderNodeList(globalCloudNodes);
            } catch (error) {
                document.getElementById('sync-status').innerText = "灵脉断绝";
                list.innerHTML = `<div class="text-sm text-yihe-red py-8 text-center">无法获取云端玉简</div>`;
            }
        }

        function renderNodeList(nodes) {
            const list = document.getElementById('file-list'); list.innerHTML = ""; 
            if (nodes.length === 0) { list.innerHTML = `<div class="text-sm text-yihe-text/40 py-8 text-center tracking-widest">空无一物</div>`; return; }
            nodes.forEach((item) => {
                const b = item.payload; if(!b) return; 
                const div = document.createElement('div');
                div.className = "list-item-pro text-yihe-text";
                const nameDisp = b.name ? (b.name[currentLang] || b.name.zh) : "佚名";
                div.innerHTML = `<span class="text-lg font-bold tracking-widest">${nameDisp}</span><span class="block text-[10px] text-yihe-text/40 font-mono mt-1">ID: ${item.objectId.substring(0,6).toUpperCase()}</span>`;
                div.onclick = () => { renderUI(b, false); document.getElementById('section-3d').scrollIntoView({ behavior: 'smooth' }); };
                list.appendChild(div);
            });
        }

        function executeHarvest() {
            const searchInput = document.getElementById('searchInput'); const target = searchInput.value.trim(); if (!target) return;
            const btn = document.getElementById('searchBtn');
            btn.innerText = "推 演 中..."; btn.style.pointerEvents = "none"; btn.classList.add('opacity-50');
            
            // 随便切一张图给点仪式感
            changeDynamicBackground();

            fetchData(target, true).finally(() => {
                btn.innerHTML = `<span class="lang-zh">起 卦 勘 测</span>`;
                btn.style.pointerEvents = "auto"; btn.classList.remove('opacity-50'); searchInput.value = ''; loadDynamicCacheList();
            });
        }

        async function fetchData(name, force = false) {
            if (currentTimer) clearInterval(currentTimer);
            document.getElementById('target-name').innerText = "天地衍算中..."; document.getElementById('target-name').style.opacity = 1;
            document.getElementById('content-display').innerHTML = ""; 
            document.getElementById('pcg-narrative').innerHTML = `<div class="text-center text-yihe-gold/50 mt-32 tracking-widest animate-pulse">正在剥离物理维度，推演营造法式...</div>`;
            
            try {
                const res = await fetch(`${API_BASE}/api/trigger_crawl`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true', 'Bypass-Tunnel-Reminder': 'true' }, body: JSON.stringify({ target: name, force: force }) });
                const data = await res.json();
                if (data.status !== "ERROR") { 
                    currentData = data.payload; renderUI(currentData, false); 
                    if (data.status === "GENERATED") setTimeout(loadDynamicCacheList, 1500); 
                    setTimeout(() => { document.getElementById('section-3d').scrollIntoView({ behavior: 'smooth' }); }, 1500);
                } else throw new Error("Error");
            } catch (err) {
                document.getElementById('pcg-narrative').innerHTML = `<div class="text-yihe-red text-center mt-32 tracking-widest leading-loose"><b>⚠️ 神谕被界外结界拦截</b><br>请<a href="${API_BASE}/api/cache_list" target="_blank" class="underline hover:text-white">点击此处打通穿透法阵</a></div>`;
            }
        }

        // 🌟 将 JSON 转为优美的叙事散文
        function updateNarrative(data) {
            const name = data.name ? (data.name[currentLang] || data.name.zh) : "此建筑";
            let narrative = `观夫<span class="text-yihe-gold font-bold mx-1 text-xl">${name}</span>之营造法式，蕴含古人天人合一、规矩方圆之理。<br><br>`;

            const dnaList = data.pcg_dna || [];
            if (dnaList.length > 0) {
                narrative += `经太虚阵法解析，其三维拓扑骨架已隐隐浮现：`;
                let params = [];
                dnaList.forEach(p => {
                    params.push(`其 <span class="text-yihe-gold font-bold">${p.label_zh || p.param_name}</span> 勘定为 <span class="font-mono bg-yihe-red/20 text-yihe-bg px-1 rounded">${p.value}</span>`);
                });
                narrative += params.join('，') + '。此等尺度，皆合乎工部定例，匠心独运。';
            }

            const techCards = data.tech_cards || [];
            if (techCards.length > 0) {
                narrative += `<br><br>细考其形制与技艺细节，亦颇为考究：`;
                let cards = [];
                techCards.forEach(c => {
                    const label = c.label?.zh || c.label;
                    const val = c.value?.zh || c.value;
                    cards.push(`于【${label}】处取 <span class="text-yihe-gold">${val}</span> 之制`);
                });
                narrative += cards.join('，且交相辉映，尽显东方营造之大美。');
            }

            if (dnaList.length === 0 && techCards.length === 0) {
                narrative += `<br><br><span class="text-yihe-text/50">（奈何岁月侵蚀，卷帙浩繁中，暂未提炼出确切的法式参数矩阵，还需后人考证。）</span>`;
            }

            if (data.academic_proof?.coordinates) {
                const coords = data.academic_proof.coordinates;
                narrative += `<br><br>其堪舆点位落于经纬 <span class="font-mono text-sm tracking-widest text-yihe-gold border-b border-yihe-gold/50 mx-1 pb-1">${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}</span> 之地，与天地山水形势遥相呼应，气象万千。`;
            }

            document.getElementById('pcg-narrative').innerHTML = narrative;
        }

        function changeDynamicBackground() {
            const bgLayer = document.getElementById('dynamic-bg-layer');
            const randomImg = bgLibrary[Math.floor(Math.random() * bgLibrary.length)];
            bgLayer.style.backgroundImage = `url('${randomImg}')`;
        }

        function renderUI(item, skipAnimation) {
            if (currentTimer) clearInterval(currentTimer); currentData = item; 
            const contentMap = item.content || {}; const text = contentMap[currentLang] || contentMap.zh || "古籍损毁，内容无法辨识。";
            
            document.getElementById('target-name').innerText = item.name ? (item.name[currentLang] || item.name.zh) : "佚名卷宗";
            document.getElementById('target-name').style.opacity = 1;

            buildDynamicModel(item.pcg_dna || []);
            trigger3DRebuild(); 
            updateNarrative(item);
            changeDynamicBackground(); // 切换背景图

            let lat = 39.9, lng = 116.4; if (item.academic_proof?.coordinates) { lat = item.academic_proof.coordinates.lat || lat; lng = item.academic_proof.coordinates.lng || lng; }
            const mapImg = document.getElementById('satellite-map');
            mapImg.src = `https://static-maps.yandex.ru/1.x/?ll=${lng},${lat}&z=17&l=sat`;

            const contentBox = document.getElementById('content-display');
            if (skipAnimation) { contentBox.innerHTML = text; } 
            else {
                let i = 0;
                currentTimer = setInterval(() => { if (i < text.length) { contentBox.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>'; i++; contentBox.scrollTop = contentBox.scrollHeight; } else { clearInterval(currentTimer); const cursor = contentBox.querySelector('.cursor'); if (cursor) cursor.style.display = 'none'; } }, 15); 
            }
        }

        function trigger3DRebuild() {
            scanState = 1; setTimeout(() => { scanState = 2; }, 3000); setTimeout(() => { scanState = 3; }, 6000);
        }

        function init() { init3D(); loadDynamicCacheList(); document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') executeHarvest(); }); }
        window.onload = init;
    </script>
</body>
</html>
